name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build →
# semantic-release → Docker → MCP Registry → security chain lives in
# WYRE-AI/reusable-workflows so this repo stays in lockstep with the rest of
# the fleet instead of drifting on its own hand-maintained copy. That host
# repo is PUBLIC by necessity: GitHub refuses to resolve a reusable workflow
# out of a private repo when the caller is public.
# Caller jobs grant the token scopes the reusable jobs request (a reusable can
# only reduce, never expand, caller-granted scope).
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
      security-events: write
    uses: WYRE-AI/reusable-workflows/.github/workflows/mcp-server-release.yml@697afaad1424f5db21c48f348f7baad9d0c9942e
    with:
      server-name: avanan-legacy-mcp
      image-name: ghcr.io/wyre-ai/avanan-legacy-mcp
    secrets: inherit
