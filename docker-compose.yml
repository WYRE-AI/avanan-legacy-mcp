services:
  # Gateway mode. Client ID and secret arrive per request on
  # X-Avanan-Client-Id and X-Avanan-Client-Secret. Do not set
  # AVANAN_CLIENT_ID, AVANAN_CLIENT_SECRET, or env_file here — that would put
  # static vendor credentials in the container. The project .env is used only
  # for Compose interpolation of CONDUIT_S2S_SECRET.
  avanan-legacy-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
